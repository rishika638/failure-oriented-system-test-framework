services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: failure_engine
      POSTGRES_PASSWORD: failure_engine_dev
      POSTGRES_DB: failure_engine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failure_engine -d failure_engine"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.1-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  target:
    build:
      context: .
      dockerfile: Dockerfile.target
    environment:
      ENABLE_TEST_FAULTS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  fault-proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    env_file: .env
    depends_on:
      target:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fault-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      fault-proxy:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
